name: release-pr

# A merged version bump publishes to PyPI, and its PR title becomes the GitHub Release
# note. This checks the PR's release label, title, and "Release and rollout" section
# against booking-agent/release-notes/<version>.json. It runs on title, body, and label
# edits too, so fixing the PR description re-runs it without a new commit.
# Lives on master only; never add it to main (the Pages branch allow-list rejects it).

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1"
    defaults:
      run:
        working-directory: booking-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync workspace from uv.lock (with dev extras)
        run: uv sync --all-packages --all-extras

      - name: Release label, title, and rollout section
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          uv run python scripts/release_notes.py pr \
            --base "origin/${BASE_REF}" \
            --title "$PR_TITLE" \
            --labels "$PR_LABELS" \
            --body-file "$RUNNER_TEMP/pr-body.md"
