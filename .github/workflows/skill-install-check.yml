name: skill-install-check

# Skill installers copy the directory holding a SKILL.md. If one ever rewrites the file
# on install (frontmatter, line endings, added fields), a genuine installed copy would
# fail the CLI's skill_unverified check and refuse to book or pay. This installs the
# skill the way users do and proves the installed bytes still match the published skill.
# Lives on master only; never add it to main (the Pages branch allow-list rejects it).
# The wix org allows only GitHub-owned actions pinned by SHA, so uv is installed with pip.

on:
  pull_request:
    paths:
      - "booking-agent/skills/booking-agent/SKILL.md"
      - "booking-agent/packages/cli/src/booking_agent_cli/skill_integrity.py"
      - ".github/workflows/skill-install-check.yml"
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  SKILL_DIR: booking-agent/skills/booking-agent
  # The skills CLI clones the default branch, so that is the copy it should reproduce.
  SKILL_URL: https://raw.githubusercontent.com/wix/booking-agent/master/booking-agent/skills/booking-agent/SKILL.md

jobs:
  skills-cli:
    name: skills CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7.0.0
        with:
          node-version: "22"

      # The documented command is interactive; CI has no TTY, so it names the agents.
      # '*' installs into every layout the CLI knows, which is what we want to check.
      - name: Install the skill the way the docs tell users to
        run: npx --yes skills add wix/booking-agent --skill booking-agent --agent '*' --yes

      - name: Every installed copy is byte-identical to the published skill
        id: installed
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/published.md" "$SKILL_URL"
          # It installs into .agents/skills/ under the working directory, which is inside
          # the workspace, so only this repository's own source copy is excluded.
          mapfile -t copies < <(find "$HOME" -name SKILL.md -path '*booking-agent*' \
            -not -path "${GITHUB_WORKSPACE}/${SKILL_DIR}/SKILL.md" \
            -not -path '*/.npm/*' -not -path '*/.git/*' 2>/dev/null | sort -u)
          if [ "${#copies[@]}" -eq 0 ]; then
            echo "::error::skills add installed no SKILL.md"
            exit 1
          fi
          echo "path=${copies[0]}" >> "$GITHUB_OUTPUT"
          rewritten=0
          for copy in "${copies[@]}"; do
            if cmp -s "$copy" "${RUNNER_TEMP}/published.md"; then
              echo "  ok       ${copy}"
            else
              echo "  REWROTE  ${copy}"
              diff -u "${RUNNER_TEMP}/published.md" "$copy" | head -20 || true
              rewritten=1
            fi
          done
          if [ "$rewritten" -ne 0 ]; then
            echo "::error::the skills CLI rewrote SKILL.md on install; the CLI hashes raw bytes, so a genuine install would now report skill_unverified"
            exit 1
          fi
          echo "::notice::${#copies[@]} installed copies, none rewritten"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: The CLI accepts the installed copy
        working-directory: booking-agent
        env:
          BOOKING_AGENT_SESSION_DIR: ${{ runner.temp }}/session
          INSTALLED: ${{ steps.installed.outputs.path }}
        run: |
          mkdir -p "$BOOKING_AGENT_SESSION_DIR"
          uv sync --all-packages --quiet
          # On a PR that raises the skill version the installed (master) copy is a different
          # version, which routes to the update offer; skill_unverified must never appear.
          uv run booking-agent flow init --user-request "haircut" --skill-path "$INSTALLED" > out.json 2>&1 || true
          cat out.json
          if grep -q skill_unverified out.json; then
            echo "::error::the CLI reports skill_unverified for a genuine installed copy"
            exit 1
          fi

  openclaw:
    name: OpenClaw
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v7.0.0
        with:
          node-version: "22"

      - name: Install the OpenClaw CLI
        run: npm i -g openclaw

      # OpenClaw's git source expects SKILL.md at the repository root, which this layout
      # does not have (CI enforces exactly one, under skills/booking-agent/), and the skill
      # is not on ClawHub. The local directory source is the one route that applies, so it
      # is the one checked: it installs straight from this checkout.
      - name: Install this repository's skill from a local directory
        id: installed
        run: |
          openclaw skills install "./${SKILL_DIR}" --as booking-agent
          installed="$HOME/.openclaw/workspace/skills/booking-agent/SKILL.md"
          if [ ! -f "$installed" ]; then
            echo "::error::openclaw skills install produced no SKILL.md at ${installed}"
            find "$HOME/.openclaw" -name SKILL.md 2>/dev/null | head || true
            exit 1
          fi
          echo "path=${installed}" >> "$GITHUB_OUTPUT"

      - name: The installed copy is byte-identical to the skill it was installed from
        run: |
          installed="${{ steps.installed.outputs.path }}"
          if cmp -s "$installed" "${SKILL_DIR}/SKILL.md"; then
            echo "::notice::OpenClaw does not rewrite SKILL.md"
            exit 0
          fi
          echo "::error::OpenClaw rewrote SKILL.md on install; the CLI hashes raw bytes, so a genuine install would now report skill_unverified"
          diff -u "${SKILL_DIR}/SKILL.md" "$installed" | head -40 || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: The CLI accepts the installed copy
        working-directory: booking-agent
        env:
          BOOKING_AGENT_SESSION_DIR: ${{ runner.temp }}/session
          INSTALLED: ${{ steps.installed.outputs.path }}
        run: |
          mkdir -p "$BOOKING_AGENT_SESSION_DIR"
          uv sync --all-packages --quiet
          uv run booking-agent flow init --user-request "haircut" --skill-path "$INSTALLED" > out.json 2>&1 || true
          cat out.json
          if grep -q skill_unverified out.json; then
            echo "::error::the CLI reports skill_unverified for a genuine installed copy"
            exit 1
          fi
