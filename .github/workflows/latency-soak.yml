name: Latency soak

# The wix org allows only GitHub-owned actions pinned by SHA, so uv is installed with pip.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  staging-soak:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: booking-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Staging latency soak
        env:
          BOOKING_AGENT_STAGING_SEARCH_QUERY: ${{ vars.BOOKING_AGENT_STAGING_SEARCH_QUERY || 'haircut' }}
        run: |
          registry_override='${{ vars.USP_REGISTRY_URL }}'
          if [ -n "$registry_override" ]; then
            export USP_REGISTRY_URL="$registry_override"
          fi
          uv run python scripts/latency_soak.py --mode staging --iterations 3
