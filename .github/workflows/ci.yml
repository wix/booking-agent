name: CI

# The wix org allows only GitHub-owned actions pinned by SHA, so uv is installed with pip.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: booking-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync workspace from uv.lock (with dev extras)
        run: uv sync --all-packages --all-extras

      - name: Confirm the matrix interpreter is in use
        run: uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}.'), sys.version"

      - name: Run tests
        run: uv run pytest -q

      - name: No-drift platform profile artifact
        run: uv run python scripts/generate_platform_profile.py --check

      - name: Verify CLI surface
        run: uv run booking-agent --help

  # Every merge into master that raises the version is published to PyPI (release.yml),
  # so a pull request that changes shipped code must raise it, and all version strings agree.
  version:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    defaults:
      run:
        working-directory: booking-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync workspace from uv.lock (with dev extras)
        run: uv sync --all-packages --all-extras

      - name: Version strings agree
        if: github.event_name != 'pull_request'
        run: uv run python scripts/check_version.py

      - name: Version strings agree and shipped changes raise the version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run python scripts/check_version.py --base "origin/${BASE_REF}"

      - name: Release metadata valid, index current, current version covered
        run: uv run python scripts/release_notes.py --check

  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install "jsonschema>=4.22" "referencing>=0.35" pytest

      - name: Validate platform-profile.json
        run: python tools/build.py

      - name: Hosting tests
        run: python -m pytest -q tests
