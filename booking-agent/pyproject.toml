[project]
name = "booking-agent-workspace"
version = "0.1.0"
description = "Booking Agent public workspace (booking-agent-cli)."
requires-python = ">=3.10"

[tool.uv.workspace]
members = ["packages/cli"]

[tool.uv.sources]
booking-agent-cli = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["packages/cli/tests"]
testpaths = ["packages/cli/tests"]
addopts = []
