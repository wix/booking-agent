[project]
name = "booking-agent-core"
version = "0.1.0"
description = "USP protocol models, profile discovery, REST client, and backend abstractions for booking-agent-cli."
requires-python = ">=3.10"
dependencies = [
    # Ed25519 for platform_key_pop proof-of-possession (USP Section 10.1.6).
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_agent"]
