[project]
name = "booking-agent-cli"
version = "0.12.0"
description = "The Booking Agent CLI: a stateful USP booking flow with hard gates, plus its USP protocol library."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Wix.com" }]
requires-python = ">=3.10"
keywords = ["booking", "scheduling", "usp", "ucp", "agent", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    # typer's runtime; the tests only pass on click>=8.2 (separate stderr capture).
    "click>=8.2",
    # Ed25519 for platform_key_pop proof-of-possession (USP Section 10.1.6).
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    # PEP 740 provenance checks before an update installs and on first run (provenance.py).
    "pypi-attestations>=0.0.30",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "starlette>=0.37",
    "timezonefinder>=6.5,<7",
    # Older typer releases either cap click below 8.2 or break on current click.
    "typer>=0.16",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# pytest-asyncio 0.23.0-0.23.4 crash on pytest 8 collection.
dev = ["pytest>=8", "pytest-asyncio>=0.23.5", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/wix/booking-agent"
Documentation = "https://github.com/wix/booking-agent/blob/master/booking-agent/README.md"
Source = "https://github.com/wix/booking-agent/tree/master/booking-agent/packages/cli"
Issues = "https://github.com/wix/booking-agent/issues"
Changelog = "https://github.com/wix/booking-agent/releases"

[project.scripts]
booking-agent = "booking_agent_cli.main:run"

[build-system]
# 1.27 is the first release that writes SPDX `license` expressions (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# 2.4 is the newest core metadata every upload path accepts; recent hatchling defaults to 2.5.
[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_agent", "src/booking_agent_cli"]
core-metadata-version = "2.4"
