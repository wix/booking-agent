[project]
name = "booking-agent-cli"
version = "0.1.0"
description = "The Booking Agent CLI — stateful USP booking flow with hard gates."
requires-python = ">=3.10"
dependencies = [
    "booking-agent-core",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "timezonefinder>=6.5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4"]

[project.scripts]
booking-agent = "booking_agent_cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_agent_cli"]
