[project]
name = "booking-agent-cli"
version = "0.1.0"
description = "The Booking Agent CLI: a stateful USP booking flow with hard gates, plus its USP protocol library."
requires-python = ">=3.10"
dependencies = [
    # Ed25519 for platform_key_pop proof-of-possession (USP Section 10.1.6).
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "starlette>=0.37",
    "timezonefinder>=6.5,<7",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4"]

[project.scripts]
booking-agent = "booking_agent_cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_agent", "src/booking_agent_cli"]
